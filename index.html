<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Đà Lạt Wander - Tra Cứu Dịch Vụ Du Lịch Đà Lạt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #112D26 0%, #1A3C34 50%, #0F2027 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #phone-frame {
        width: 100%;
        max-width: 440px;
        height: 100vh;
        max-height: 920px;
        background: #F8FAF9;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      @media (min-width: 480px) {
        #phone-frame {
          height: 94vh;
          border-radius: 36px;
          border: 9px solid #1F2937;
        }
      }
      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="phone-frame">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
