<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Đà Lạt Wander — Modern Editorial Edition (2026)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Times New Roman', Times, 'Playfair Display', Georgia, serif;
        background: radial-gradient(circle at center, #1E1E1E 0%, #121212 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #phone-frame {
        width: 100%;
        max-width: 440px;
        height: 100vh;
        max-height: 920px;
        background: #FAF8F5;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      @media (min-width: 480px) {
        #phone-frame {
          height: 94vh;
          border-radius: 36px;
          border: 9px solid #1E1E1E;
        }
      }
      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      /* Custom fine editorial scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4CEBF;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="phone-frame">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
